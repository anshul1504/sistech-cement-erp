{% for field in form %}<div class="auth-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label><div class="input-wrap {% if field.errors %}has-error{% endif %}">{{ field }}{% if field.field.widget.input_type == 'password' %}<button class="password-toggle" type="button" data-password-target="{{ field.id_for_label }}" aria-label="Show {{ field.label|lower }}" aria-pressed="false"><svg><use href="#i-eye"/></svg></button>{% endif %}</div>{% if field.errors %}<div class="field-errors" role="alert">{{ field.errors }}</div>{% endif %}{% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}</div>{% endfor %}<div class="caps-warning" hidden>Caps Lock is on.</div>
