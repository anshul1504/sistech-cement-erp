{% if page.has_other_pages %}<div class="pagination-bar"><span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a href="?{{ request.GET.urlencode }}&amp;page={{ page.previous_page_number }}">← Previous</a>{% endif %} {% if page.has_next %}<a href="?{{ request.GET.urlencode }}&amp;page={{ page.next_page_number }}">Next →</a>{% endif %}</div></div>{% endif %}
