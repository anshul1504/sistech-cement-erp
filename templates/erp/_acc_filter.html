<form method="get" class="doc-filter acc-filter">{% if not single %}<input class="form-control" type="date" name="from" value="{{ start|date:'Y-m-d' }}" aria-label="From">{% endif %}<input class="form-control" type="date" name="to" value="{{ end|date:'Y-m-d' }}" aria-label="{% if single %}As on{% else %}To{% endif %}">
  <select class="form-select" name="site" aria-label="Plant"><option value="">All plants</option>{% for s in sites %}<option value="{{ s.pk }}"{% if site.pk == s.pk %} selected{% endif %}>{{ s.code }}</option>{% endfor %}</select>{{ extra }}<button class="org-btn is-light" type="submit">Show</button></form>
