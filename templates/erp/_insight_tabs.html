{% if areas %}<label class="ins-tabs-select"><span>Dashboard</span><select class="form-select" onchange="if (this.value) location.href = this.value" aria-label="Choose dashboard"><option value="{% url 'dashboard' %}?{{ period.query }}{{ site_q }}"{% if not area and title != 'Report packs' %} selected{% endif %}>Home</option>{% for a in areas %}<option value="{% url 'insight_area' a.key %}?{{ period.query }}{{ site_q }}"{% if area == a.key %} selected{% endif %}>{{ a.label }}</option>{% endfor %}<option value="{% url 'report_packs' %}"{% if title == 'Report packs' %} selected{% endif %}>Report packs</option></select></label>{% endif %}
{% if areas %}<nav class="ins-tabs" aria-label="Dashboards"><a href="{% url 'dashboard' %}?{{ period.query }}{{ site_q }}"{% if not area %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-dashboard"/></svg>Home</a>{% for a in areas %}<a href="{% url 'insight_area' a.key %}?{{ period.query }}{{ site_q }}"{% if area == a.key %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-{{ a.icon }}"/></svg>{{ a.label }}</a>{% endfor %}<a href="{% url 'report_packs' %}"{% if title == 'Report packs' %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-download"/></svg>Report packs</a></nav>{% endif %}
