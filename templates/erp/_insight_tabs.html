{% if areas %}<label class="ins-tabs-select"><span>Dashboard</span><select class="form-select" onchange="if (this.value) location.href = this.value" aria-label="Choose dashboard">{% if tab_scope == 'insights' %}<option value="{% url 'overview' %}?{{ period.query }}{{ site_q }}"{% if not area and title != 'Report packs' %} selected{% endif %}>Overview</option>{% endif %}{% for a in areas %}<option value="{% url 'insight_area' a.key %}?{{ period.query }}{{ site_q }}"{% if area == a.key %} selected{% endif %}>{{ a.label }}</option>{% endfor %}{% if tab_scope == 'sales' and can_team_tab %}<option value="{% url 'sales_team' %}?{{ period.query }}{{ site_q }}"{% if team_page %} selected{% endif %}>Sales team</option>{% endif %}{% if tab_scope == 'insights' %}<option value="{% url 'report_packs' %}"{% if title == 'Report packs' %} selected{% endif %}>Report packs</option>{% endif %}</select></label>{% endif %}
{% if areas %}<nav class="ins-tabs" aria-label="Dashboards">{% if tab_scope == 'insights' %}<a href="{% url 'overview' %}?{{ period.query }}{{ site_q }}"{% if not area and title != 'Report packs' %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-dashboard"/></svg>Overview</a>{% endif %}{% for a in areas %}<a href="{% url 'insight_area' a.key %}?{{ period.query }}{{ site_q }}"{% if area == a.key %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-{{ a.icon }}"/></svg>{{ a.label }}</a>{% endfor %}{% if tab_scope == 'sales' and can_team_tab %}<a href="{% url 'sales_team' %}?{{ period.query }}{{ site_q }}"{% if team_page %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-chart"/></svg>Sales team</a>{% endif %}{% if tab_scope == 'insights' %}<a href="{% url 'report_packs' %}"{% if title == 'Report packs' %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-download"/></svg>Report packs</a>{% endif %}</nav>{% endif %}
