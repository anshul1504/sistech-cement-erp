{% if areas %}<nav class="ins-tabs" aria-label="Dashboards"><a href="{% url 'dashboard' %}?{{ period.query }}{{ site_q }}"{% if not area %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-dashboard"/></svg>Home</a>{% for a in areas %}<a href="{% url 'insight_area' a.key %}?{{ period.query }}{{ site_q }}"{% if area == a.key %} class="is-active" aria-current="page"{% endif %}><svg><use href="#ic-{{ a.icon }}"/></svg>{{ a.label }}</a>{% endfor %}</nav>{% endif %}
