{% if field.field.widget.input_type == 'checkbox' %}<div class="org-field org-check"><label class="org-check-label" for="{{ field.id_for_label }}">{{ field }}<span><strong>{{ field.label }}</strong>{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}</span></label></div>
{% else %}<div class="org-field{% if field.name == 'notes' %} is-wide{% endif %}{% if field.errors %} has-error{% endif %}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required">*</span>{% endif %}{% if field.field.disabled %} <span class="mst-lock">🔒</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}{% for e in field.errors %}<div class="org-error">{{ e }}</div>{% endfor %}</div>{% endif %}
